<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>520驚喜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050010; /* 深邃的夜空背景色 */
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        
        /* 背景的畫布 (流星與代碼雨) */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 讓畫面中間的元素絕對置中 */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            pointer-events: none; /* 讓滑鼠點擊可以穿透 */
        }

        /* ================= 階段一：愛心 ================= */
        #phase-heart {
            opacity: 1;
            transition: opacity 1.5s ease-in-out; /* 淡出動畫時間 */
        }
        
        /* 使用 CSS 畫出一顆發光的愛心 */
        .heart {
            position: relative;
            width: 100px;
            height: 90px;
            animation: heartbeat 1.2s infinite alternate; /* 心跳動畫 */
            filter: drop-shadow(0 0 15px #ff3385) drop-shadow(0 0 35px #ff0066);
        }
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 50px;
            height: 80px;
            border-radius: 50px 50px 0 0;
            background: #ff66b2; /* 愛心顏色 */
        }
        .heart::before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* ================= 階段二：文字 ================= */
        #phase-text {
            opacity: 0; /* 一開始是隱藏的 */
            transition: opacity 2s ease-in-out; /* 淡入動畫時間 */
            text-shadow: 0 0 10px #ff66b2, 0 0 20px #ff66b2, 0 0 40px #ff0066;
            white-space: nowrap;
        }
        #phase-text h1 {
            font-size: 6rem;
            margin: 0;
            letter-spacing: 5px;
        }
        #phase-text p {
            font-size: 2.5rem;
            margin: 10px 0 0 0;
        }

        /* 用來控制隱藏的工具 class */
        .hidden {
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="center-container">
        
        <div id="phase-heart">
            <div class="heart"></div>
        </div>

        <div id="phase-text">
            <h1>520快樂</h1>
            <p>祝天天開心</p>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- 1. 浪漫代碼雨設定 ---
        const texts = 'ILOVEU♡★'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        // 讓代碼一開始就隨機分佈在畫面上，而不是從零開始掉
        for (let x = 0; x < columns; x++) {
            drops[x] = Math.random() * (canvas.height / fontSize);
        }

        // --- 2. 流星雨設定 ---
        class Meteor {
            constructor() {
                this.reset();
                // 為了讓一打開網頁就有流星，隨機初始化位置
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
            }
            reset() {
                // 流星從右上方隨機出現
                this.x = Math.random() * canvas.width + canvas.width / 3;
                this.y = -100;
                this.length = Math.random() * 80 + 50; // 流星尾巴長度
                this.speed = Math.random() * 15 + 10;  // 墜落速度
            }
            draw() {
                ctx.beginPath();
                // 流星頭部
                ctx.moveTo(this.x, this.y);
                // 流星尾部 (往右上角延伸)
                ctx.lineTo(this.x + this.length, this.y - this.length);
                
                // 漸層讓流星有拖曳閃爍感
                let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.length, this.y - this.length);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)'); // 頭部最亮
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)'); // 尾部透明
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            update() {
                // 流星往左下角移動
                this.x -= this.speed;
                this.y += this.speed;
                // 飛出螢幕後重置
                if (this.x < -this.length || this.y > canvas.height + this.length) {
                    this.reset();
                }
            }
        }

        // 產生 12 顆流星
        const meteors = [];
        for(let i = 0; i < 12; i++) {
            meteors.push(new Meteor());
        }

        // --- 3. 繪圖迴圈 ---
        function draw() {
            // 背景塗上帶有透明度的深色，製造代碼雨的殘影
            ctx.fillStyle = 'rgba(5, 0, 16, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫代碼雨
            ctx.fillStyle = '#ff66b2';
            ctx.font = fontSize + 'px arial';
            for (let i = 0; i < drops.length; i++) {
                const text = texts[Math.floor(Math.random() * texts.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            // 畫流星
            for(let meteor of meteors) {
                meteor.update();
                meteor.draw();
            }
        }

        // 每 30 毫秒刷新一次畫面
        setInterval(draw, 30);

        // 視窗大小改變時自動調整畫布
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- 4. 動畫時序控制 (核心驚喜切換) ---
        // 5000 毫秒 (即 5 秒) 後執行
        setTimeout(() => {
            // 隱藏愛心
            document.getElementById('phase-heart').classList.add('hidden');
            // 顯示文字
            const textElement = document.getElementById('phase-text');
            textElement.classList.remove('hidden');
            textElement.style.opacity = 1; 
        }, 5000);

    </script>
</body>
</html>
